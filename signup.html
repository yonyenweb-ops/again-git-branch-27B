<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up &mdash; MyApp</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">MyApp</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="cart.html">Cart <span class="cart-count">0</span></a>
      <a href="signin.html">Sign in</a>
      <a href="signup.html" class="signup-link">Sign up</a>
    </nav>
  </header>

  <div class="auth-wrap">
    <div class="card">
      <h1>Create account</h1>
      <p class="subtitle">Sign up to get started</p>

      <form action="#" method="post">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="Jane Doe" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a password" minlength="8" required>
          <small>Must be at least 8 characters</small>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" minlength="8" required>
        </div>

        <div class="options">
          <label>
            <input type="checkbox" name="terms" required>
            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" class="submit">Sign Up</button>
      </form>

      <p class="footer-text">Already have an account? <a href="signin.html">Sign in</a></p>
    </div>
  </div>

  <footer class="site-footer">
    &copy; 2026 MyApp. All rights reserved.
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>

</body>
</html>
