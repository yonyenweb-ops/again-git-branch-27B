<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart &mdash; MyApp</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">MyApp</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="cart.html">Cart <span class="cart-count">0</span></a>
      <a href="signin.html">Sign in</a>
      <a href="signup.html" class="signup-link">Sign up</a>
    </nav>
  </header>

  <section class="section">
    <h2>Your cart</h2>
    <p class="section-subtitle">Review your items before checkout</p>
    <div id="cart-content"></div>
  </section>

  <footer class="site-footer">
    &copy; 2026 MyApp. All rights reserved.
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    const content = document.getElementById("cart-content");
    const SHIPPING = 5.99;

    function render() {
      const cart = getCart();

      if (cart.length === 0) {
        content.innerHTML = `
          <div class="empty-cart">
            <p>Your cart is empty.</p>
            <p style="margin-top:8px;"><a href="shop.html">Browse products &rarr;</a></p>
          </div>
        `;
        return;
      }

      const rows = cart.map((item) => {
        const product = PRODUCTS.find((p) => p.id === item.id);
        if (!product) return "";
        const lineTotal = product.price * item.qty;
        return `
          <div class="cart-item" data-id="${product.id}">
            <div class="product-image">${product.emoji}</div>
            <div class="cart-item-info">
              <div class="product-name">${product.name}</div>
              <div class="cart-item-price">${formatPrice(product.price)} each</div>
            </div>
            <div class="qty-control">
              <button class="qty-decrease" aria-label="Decrease quantity">&minus;</button>
              <span>${item.qty}</span>
              <button class="qty-increase" aria-label="Increase quantity">+</button>
            </div>
            <div class="line-total">${formatPrice(lineTotal)}</div>
            <button class="remove-item">Remove</button>
          </div>
        `;
      }).join("");

      const subtotal = cart.reduce((sum, item) => {
        const product = PRODUCTS.find((p) => p.id === item.id);
        return product ? sum + product.price * item.qty : sum;
      }, 0);
      const total = subtotal + SHIPPING;

      content.innerHTML = `
        <div class="cart-layout">
          <div class="cart-items">${rows}</div>
          <div class="cart-summary">
            <h2>Order summary</h2>
            <div class="summary-row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
            <div class="summary-row"><span>Shipping</span><span>${formatPrice(SHIPPING)}</span></div>
            <div class="summary-row total"><span>Total</span><span>${formatPrice(total)}</span></div>
            <button class="btn btn-primary" style="width:100%;margin-top:18px;" id="checkout-btn">Checkout</button>
          </div>
        </div>
      `;
    }

    content.addEventListener("click", (e) => {
      const itemEl = e.target.closest(".cart-item");
      if (!itemEl) {
        if (e.target.id === "checkout-btn") {
          alert("This is a demo store — checkout isn't wired up yet.");
        }
        return;
      }
      const id = Number(itemEl.dataset.id);
      const cart = getCart();
      const item = cart.find((i) => i.id === id);
      if (!item) return;

      if (e.target.classList.contains("qty-increase")) {
        setQty(id, item.qty + 1);
        render();
      } else if (e.target.classList.contains("qty-decrease")) {
        setQty(id, item.qty - 1);
        render();
      } else if (e.target.classList.contains("remove-item")) {
        removeFromCart(id);
        render();
      }
    });

    render();
  </script>

</body>
</html>
