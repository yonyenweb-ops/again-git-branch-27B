<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyApp Shop &mdash; Home</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="logo">MyApp</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="cart.html">Cart <span class="cart-count">0</span></a>
      <a href="signin.html">Sign in</a>
      <a href="signup.html" class="signup-link">Sign up</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Everything you need,<br>all in one place</h1>
    <p>Discover great products at honest prices. Free shipping on every order over $50.</p>
    <div class="hero-actions">
      <a href="shop.html" class="btn btn-primary">Shop now</a>
      <a href="signup.html" class="btn btn-secondary">Create an account</a>
    </div>
  </section>

  <section class="section">
    <h2>Featured products</h2>
    <p class="section-subtitle">A few of our customers' favorites</p>
    <div class="product-grid" id="featured-grid"></div>
  </section>

  <footer class="site-footer">
    &copy; 2026 MyApp. All rights reserved.
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    const grid = document.getElementById("featured-grid");
    PRODUCTS.slice(0, 4).forEach((p) => {
      const card = document.createElement("div");
      card.className = "product-card";
      card.innerHTML = `
        <div class="product-image">${p.emoji}</div>
        <div class="product-info">
          <div class="product-category">${p.category}</div>
          <div class="product-name">${p.name}</div>
          <div class="product-price">${formatPrice(p.price)}</div>
          <button class="add-to-cart-btn" data-id="${p.id}">Add to cart</button>
        </div>
      `;
      grid.appendChild(card);
    });

    grid.addEventListener("click", (e) => {
      if (!e.target.classList.contains("add-to-cart-btn")) return;
      const id = Number(e.target.dataset.id);
      addToCart(id);
      e.target.textContent = "Added ✓";
      e.target.classList.add("added");
      setTimeout(() => {
        e.target.textContent = "Add to cart";
        e.target.classList.remove("added");
      }, 1200);
    });
  </script>

</body>
</html>
